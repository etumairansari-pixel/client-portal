<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Eiretech Client Portal</title>
		<style>
			:root {
				color-scheme: dark;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #050b18;
				font-family:
					Manrope,
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				color: #e2e8f0;
				overflow: hidden;
			}
			.bg {
				position: fixed;
				inset: 0;
				background:
					radial-gradient(
						circle at 50% 50%,
						rgba(47, 141, 230, 0.45) 0%,
						rgba(47, 141, 230, 0.12) 28%,
						rgba(5, 11, 24, 0) 60%
					),
					linear-gradient(180deg, #050b18 0%, #071a33 100%);
			}
			.wrap {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 22px;
				height: 100%;
				text-align: center;
			}
			.logo {
				width: min(300px, 70vw);
				height: auto;
				filter: drop-shadow(0 8px 30px rgba(47, 141, 230, 0.5));
				animation: rise 0.8s ease-out both;
			}
			.status {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 13px;
				letter-spacing: 0.02em;
				color: #93c5fd;
				animation: rise 0.8s 0.2s ease-out both;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 999px;
				background: #2f8de6;
				box-shadow: 0 0 0 0 rgba(47, 141, 230, 0.7);
				animation: pulse 1.4s ease-out infinite;
			}
			@keyframes pulse {
				to {
					box-shadow: 0 0 0 12px rgba(47, 141, 230, 0);
				}
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.logo,
				.status,
				.dot {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="bg"></div>
		<div class="wrap">
			<!-- Mark mirrors public/logos/eiretech-mark.svg; wordmark uses light fill for the dark backdrop -->
			<svg
				class="logo"
				viewBox="0 0 138 28"
				fill="none"
				xmlns="http://www.w3.org/2000/svg"
				role="img"
				aria-label="Eiretech 360"
			>
				<g transform="scale(0.28)">
					<path d="M0 0H60A40 40 0 0 1 100 40V60A40 40 0 0 1 60 100H40A40 40 0 0 1 0 60Z" fill="#2F8DE6" />
					<path
						d="M1 70C30 78 56 72 72 54C79 46 80 40 75 36"
						fill="none"
						stroke="#FFFFFF"
						stroke-width="3.6"
						stroke-linecap="round"
					/>
					<path d="M61 79.5A26 26 0 1 1 73.1 63.7L60.6 60.4A13 13 0 1 0 54.5 68.3Z" fill="#FFFFFF" />
					<rect x="35" y="51.5" width="38" height="11" fill="#FFFFFF" />
					<circle cx="68" cy="23" r="4.6" fill="#7DBF3C" />
				</g>
				<text
					x="35"
					y="21"
					font-family="Manrope, Inter, ui-sans-serif, system-ui, sans-serif"
					font-size="20"
					font-weight="600"
					letter-spacing="-0.4"
					fill="#F8FAFC"
					textLength="84"
					lengthAdjust="spacingAndGlyphs"
				>
					e&#305;retech
				</text>
				<circle cx="52.2" cy="7.4" r="1.9" fill="#7DBF3C" />
				<text
					x="121"
					y="22"
					font-family="Manrope, Inter, ui-sans-serif, system-ui, sans-serif"
					font-size="7"
					font-weight="600"
					fill="#7CB8F5"
				>
					360°
				</text>
			</svg>
			<div class="status">
				<span class="dot"></span>
				<span>Starting the client portal…</span>
			</div>
		</div>
	</body>
</html>
