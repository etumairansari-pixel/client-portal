name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144
  # Build-time placeholders only. No live database, mail or storage is ever
  # reached from CI; the HTTP matrices need a seeded server and run locally.
  DATABASE_URL: mongodb://ci:ci@localhost:27017/ci
  SESSION_SECRET: ci-only-session-secret-not-used-anywhere-real
  APP_URL: http://localhost:3000

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build
